# ═══════════════════════════════════════════════════════════════
#  Nginx — Build AI With Us reverse proxy
#  Routes all traffic (HTTP + WebSocket) to the Express app
# ═══════════════════════════════════════════════════════════════

events {
  worker_connections 1024;
}

http {
  # ── Upstream: Express app container ──────────────────────────
  upstream app_server {
    server app:4000;
    keepalive 32;
  }

  # ── Logging ──────────────────────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # ── Gzip compression ─────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml image/svg+xml;

  # ── HTTP → HTTPS redirect (uncomment once SSL is configured) ─
  # server {
  #   listen 80;
  #   server_name yourdomain.com www.yourdomain.com;
  #   return 301 https://$host$request_uri;
  # }

  # ── Main server block ─────────────────────────────────────────
  server {
    listen 80;
    # listen 443 ssl;                      # uncomment for HTTPS
    server_name _;                         # accepts any hostname (change to your domain)

    # ── SSL (uncomment + set paths once you have certs) ─────────
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # ── Security headers ────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # ── Socket.io WebSocket endpoint ────────────────────────────
    location /socket.io/ {
      proxy_pass         http://app_server;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_read_timeout 3600s;     # keep long-lived connections alive
    }

    # ── All other traffic → Express ─────────────────────────────
    location / {
      proxy_pass         http://app_server;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_connect_timeout 60s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }
  }
}
