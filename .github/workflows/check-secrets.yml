name: 🔍 Check Doppler Secrets
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOPPLER_TOKEN
          script: |
            echo "=== Checking GEMINI_API_KEY in Doppler prd ==="
            VALUE=$(DOPPLER_TOKEN=$DOPPLER_TOKEN doppler secrets get GEMINI_API_KEY \
              --project quranacademy --config prd --plain 2>&1)
            if [ -z "$VALUE" ] || [ "$VALUE" = "null" ]; then
              echo "❌ GEMINI_API_KEY is EMPTY or not set"
            else
              echo "✅ GEMINI_API_KEY is SET (length: ${#VALUE} chars)"
            fi
