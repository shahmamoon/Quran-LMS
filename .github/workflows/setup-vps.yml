name: 🔧 VPS First-Time Setup

# Run this ONCE manually to prepare the server.
# After it succeeds you can delete or disable this workflow.
on:
  workflow_dispatch:

jobs:
  setup:
    name: Install Docker + Doppler on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Set up VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Online Quran Academy — VPS Setup"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ── 1. System update ───────────────────────
            echo "📦 Updating system packages..."
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl wget gnupg2 ca-certificates lsb-release

            # ── 2. Install Docker (if not present) ─────
            if ! command -v docker &>/dev/null; then
              echo "🐳 Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
              usermod -aG docker $USER || true
              echo "✅ Docker installed: $(docker --version)"
            else
              echo "✅ Docker already installed: $(docker --version)"
            fi

            # ── 3. Install Docker Compose plugin ───────
            if ! docker compose version &>/dev/null; then
              echo "🐳 Installing Docker Compose plugin..."
              apt-get install -y -qq docker-compose-plugin
            fi
            echo "✅ Docker Compose: $(docker compose version)"

            # ── 4. Install Doppler CLI ──────────────────
            if ! command -v doppler &>/dev/null; then
              echo "🔐 Installing Doppler CLI..."
              curl -Ls https://cli.doppler.com/install.sh | sh
              echo "✅ Doppler installed: $(doppler --version)"
            else
              echo "✅ Doppler already installed: $(doppler --version)"
            fi

            # ── 5. Create deployment directory ─────────
            echo "📁 Creating /opt/quranacademy..."
            mkdir -p /opt/quranacademy
            chown -R $USER:$USER /opt/quranacademy || true

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ VPS setup complete!"
            echo "   Docker:  $(docker --version)"
            echo "   Compose: $(docker compose version)"
            echo "   Doppler: $(doppler --version)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
