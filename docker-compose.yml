services:
  postgres:
    image: postgres:16-alpine
    container_name: quranacademy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lmsuser
      POSTGRES_PASSWORD: lmspassword
      POSTGRES_DB: quranacademy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmsuser -d quranacademy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
